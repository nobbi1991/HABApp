# Runs the HABApp tests (run/conf_testing) against a fresh openHAB and mosquitto.
#
#   docker compose -f run/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from habapp
#   docker compose -f run/docker-compose.test.yml down -v
#
# Variables: OPENHAB_VERSION (default 5.2.5), PYTHON_VERSION (default 3.14)
name: habapp-tests

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ../.github/workflows/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  openhab:
    image: openhab/openhab:${OPENHAB_VERSION:-5.2.5}
    ports:
      - "8080:8080"
    environment:
      EXTRA_JAVA_OPTS: "-Duser.timezone=UTC -Duser.language=de -Duser.region=DE -Djava.awt.headless=true"
    volumes:
      # config and the test user are in place before the first start -> no restart needed
      - ./conf_testing/lib/openhab/conf:/openhab/conf
      - ./conf_testing/lib/openhab/userdata/jsondb/users.json:/openhab/userdata/jsondb/users.json
    healthcheck:
      test:
        - CMD-SHELL
        - |
          # Wait until openHAB has (nearly) started and runs for some time: some versions (e.g. 5.2) restart once
          # shortly after the first start. If HABApp connects during the restart the tests can hang.
          # The uptime starts again with 0 after the restart. Credentials are the ones of the test user.
          info=$$(curl -fs -m 5 -u asdf:strong_password http://localhost:8080/rest/systeminfo) || exit 1
          level=$$(echo "$$info" | sed -n 's/.*"startLevel": *\([0-9]*\).*/\1/p')
          uptime=$$(echo "$$info" | sed -n 's/.*"uptime": *\([0-9]*\).*/\1/p')
          [ "$${level:-0}" -ge 70 ] && [ "$${uptime:-0}" -ge 30 ] || exit 1
          # Enable the debug logging for the websocket (a bit later than the rest api the karaf console is ready).
          # HABApp is started afterwards, so these messages are in the openhab.log from the beginning.
          [ -f /tmp/log-levels-set ] && exit 0
          # The client only executes the commands if they are read from stdin (arguments are ignored without a
          # terminal). Its exit code is always 1, an error can only be seen in the output ("Failed to get the session.").
          out=$$(printf 'log:set DEBUG org.eclipse.jetty.websocket\nlog:set DEBUG org.openhab.core.io.websocket\n' | /openhab/runtime/bin/client -h localhost -a 8101 -u openhab -p habopen 2>&1)
          echo "$$out" | grep -qiE "failed|refused|denied" && exit 1
          touch /tmp/log-levels-set
      interval: 10s
      timeout: 30s
      retries: 60
      start_period: 60s

  habapp:
    build:
      context: ..
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14}
        EXTRA_PIP_PACKAGES: "pytest==9.2.0 packaging==26.3"
    depends_on:
      mosquitto:
        condition: service_started
      openhab:
        condition: service_healthy
    volumes:
      - ./conf_testing:/habapp/config
      # log folder has to exist before HABApp starts (the debug traceback file is opened before the folders are created)
      - ./conf_testing/log:/habapp/config/log
