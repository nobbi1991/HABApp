name: Run OpenHAB Tests

on:
  workflow_dispatch:
    inputs:
      minors:
        description: 'openHAB minor versions to test (space separated). The newest patch version of each is used.'
        required: false
        default: '4.3 5.0 5.1 5.2'

jobs:
  # openHAB only publishes the exact versions (no floating tags like "5.2").
  # The newest patch version of every minor version below is looked up, so only the minor versions have to be maintained.
  # The newest milestone / release candidate (e.g. 5.3.0.M5) is always added as long as there is no final release for it.
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Resolve newest patch versions
      id: resolve
      env:
        MINORS: ${{ inputs.minors }}
      run: python .github/scripts/resolve_openhab_versions.py ${MINORS:-4.3 5.0 5.1 5.2}

  test:
    name: test (openHAB ${{ matrix.openhab }})
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    env:
      OPENHAB_VERSION: ${{ matrix.openhab }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    # openHAB, mosquitto and HABApp (with the tests from run/conf_testing) run in containers.
    # Same command as locally, see run/docker-compose.test.yml
    - name: Run HABApp tests
      run: |
        docker compose -f run/docker-compose.test.yml up --build \
          --abort-on-container-exit --exit-code-from habapp

    # Why did the tests not run? Collect infos about the openHAB container (e.g. if it never became healthy)
    - name: Diagnostics
      if: failure() || cancelled()  # a timeout counts as cancelled
      run: |
        mkdir -p logs
        {
          echo "== runner"; nproc; free -m; df -h /
          echo "== docker compose ps"; docker compose -f run/docker-compose.test.yml ps -a
          echo "== openhab container state"; docker inspect habapp-tests-openhab-1 --format '{{json .State}}'
          echo "== openhab healthcheck log"
          docker inspect habapp-tests-openhab-1 --format '{{json .State.Health.Log}}'
          echo "== processes in openhab container"; docker exec habapp-tests-openhab-1 ps aux
          echo "== GET /rest/ inside the openhab container"
          docker exec habapp-tests-openhab-1 curl -s -i -m 10 http://localhost:8080/rest/ | head -n 20
          echo "== openhab userdata/logs and tmp"
          docker exec habapp-tests-openhab-1 ls -la /openhab/userdata/logs /openhab/userdata/tmp
          echo "== tail of openhab.log"; docker exec habapp-tests-openhab-1 tail -n 80 /openhab/userdata/logs/openhab.log
          echo "== thread dump of the openhab jvm (see thread_dump.txt)"
          # The image has no jcmd/jstack: SIGQUIT lets the jvm print the thread dump to the container output.
          # There can be more than one karaf jvm (openHAB restarts itself after the first start).
          docker exec habapp-tests-openhab-1 sh -c 'for p in $(pgrep -f org.apache.karaf.main.Main); do echo "pid $p"; kill -3 $p; done'
          sleep 3
          docker logs habapp-tests-openhab-1 2>&1 | sed -n '/Full thread dump/,$p' > logs/thread_dump.txt
          wc -l logs/thread_dump.txt
          echo "== container output (tail)"; docker logs --tail 60 habapp-tests-openhab-1
        } > logs/diagnostics.txt 2>&1 || true

    # HABApp might crash on startup and still exit with 0 -> the report is only written if the tests have run
    - name: Check that the tests have run
      if: always()
      run: |
        if [ ! -f run/conf_testing/log/test_report.xml ]; then
          echo "::error::No test report found - the tests did not run (HABApp crashed or did not start)"
          exit 1
        fi

    - name: Prepare log files
      if: always()
      run: |
        mkdir -p logs/HABApp logs/OpenHAB

        # HABApp logs and test reports
        if [ -d run/conf_testing/log ]; then
          cp -r run/conf_testing/log/. logs/HABApp/ || true
        fi

        # openHAB logs (the containers are stopped but still exist)
        docker cp habapp-tests-openhab-1:/openhab/userdata/logs/. logs/OpenHAB/ || true

        # console output of all containers
        docker compose -f run/docker-compose.test.yml logs --no-color --timestamps > logs/compose.log || true

        find logs -type f | sort

    - name: Upload log files
      id: upload_logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        # the attempt makes the name unique when a job is re-run (otherwise there are two artifacts with the same name)
        name: logs-openhab-${{ matrix.openhab }}-attempt-${{ github.run_attempt }}
        path: logs/
        retention-days: 7
        if-no-files-found: warn

    - name: Show test report
      if: always()
      run: |
        echo "**openHAB ${OPENHAB_VERSION}** - [Download the logs](${LOGS_URL})" >> "$GITHUB_STEP_SUMMARY"
        if [ -f run/conf_testing/log/test_report.md ]; then
          cat run/conf_testing/log/test_report.md >> "$GITHUB_STEP_SUMMARY"
        fi
      env:
        LOGS_URL: ${{ steps.upload_logs.outputs.artifact-url }}

    - name: Stop containers
      if: always()
      run: docker compose -f run/docker-compose.test.yml down -v

  # Overview of all openHAB versions in the summary of the workflow run
  summary:
    name: summary
    needs: [versions, test]
    if: always() && needs.versions.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Download logs of all versions
      uses: actions/download-artifact@v8
      with:
        pattern: logs-openhab-*
        path: artifacts

    - name: Summarize test reports
      env:
        VERSIONS: ${{ join(fromJSON(needs.versions.outputs.matrix).openhab, ' ') }}
      run: python .github/scripts/summarize_test_reports.py artifacts $VERSIONS
