name: Run OpenHAB Tests

on:
  workflow_dispatch:

jobs:
  # openHAB only publishes the exact versions (no floating tags like "5.2").
  # The newest patch version of every minor version below is looked up, so only the minor versions have to be maintained.
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Resolve newest patch versions
      id: resolve
      run: python .github/scripts/resolve_openhab_versions.py 4.3 5.0 5.1 5.2

  test:
    name: test (openHAB ${{ matrix.openhab }})
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    env:
      OPENHAB_VERSION: ${{ matrix.openhab }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    # openHAB, mosquitto and HABApp (with the tests from run/conf_testing) run in containers.
    # Same command as locally, see run/docker-compose.test.yml
    - name: Run HABApp tests
      run: |
        docker compose -f run/docker-compose.test.yml up --build \
          --abort-on-container-exit --exit-code-from habapp

    # HABApp might crash on startup and still exit with 0 -> the report is only written if the tests have run
    - name: Check that the tests have run
      if: always()
      run: |
        if [ ! -f run/conf_testing/log/test_report.xml ]; then
          echo "::error::No test report found - the tests did not run (HABApp crashed or did not start)"
          exit 1
        fi

    - name: Show test report
      if: always()
      run: |
        echo "**openHAB ${OPENHAB_VERSION}**" >> "$GITHUB_STEP_SUMMARY"
        if [ -f run/conf_testing/log/test_report.md ]; then
          cat run/conf_testing/log/test_report.md >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Prepare log files
      if: always()
      run: |
        mkdir -p logs/HABApp logs/OpenHAB

        # HABApp logs and test reports
        if [ -d run/conf_testing/log ]; then
          cp -r run/conf_testing/log/. logs/HABApp/ || true
        fi

        # openHAB logs (the containers are stopped but still exist)
        docker cp habapp-tests-openhab-1:/openhab/userdata/logs/. logs/OpenHAB/ || true

        # console output of all containers
        docker compose -f run/docker-compose.test.yml logs --no-color --timestamps > logs/compose.log || true

        find logs -type f | sort

    - name: Upload log files
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: logs-openhab-${{ matrix.openhab }}
        path: logs/
        retention-days: 7
        if-no-files-found: warn

    - name: Stop containers
      if: always()
      run: docker compose -f run/docker-compose.test.yml down -v
